name: Verify ring puzzles
on:
  push:
    branches: [main]
  pull_request:
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check engine.mjs
          node --check stages.mjs
          node --check game.mjs
          node --check tools/serve.mjs
      - name: Solve all stages
        run: npm test
